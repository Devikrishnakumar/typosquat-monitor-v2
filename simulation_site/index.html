<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Payment Security Test Lab</title>
    <style>
        body {
            margin: 0;
            background: #f5f7fb;

            background: #111827;

            padding: 22px 50px;

        }

        .container {
            max-width: 900px;
            margin: 70px auto;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .logo {
            font-size: 40px;
            font-weight: bold;
            color: #003087;
        }

        .warning {
            margin: 25px 0;
            padding: 15px;
            background: #fff7ed;
            border-left: 5px solid #f59e0b;
            text-align: left;
        }

        .button {
            display: inline-block;
