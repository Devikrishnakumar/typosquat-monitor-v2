<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Login - Simulation</title>
    <style>
        body {
            margin: 0;
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 380px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #003087;
            margin-bottom: 10px;
        }

        .simulation {
            text-align: center;
            color: #f59e0b;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #003087;
            color: white;
            font-weight: bold;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            background: #fff7ed;
            border-left: 4px solid #f59e0b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">PAYPAL TEST</div>

    <div class="simulation">
        CONTROLLED SIMULATION LOGIN
    </div>

    <form action="#" method="post">

        <label for="email">Email or Username</label>
        <input id="email" name="email" type="email">

        <label for="password">Password</label>
        <input id="password" name="password" type="password">

        <button type="submit">
            Test Login
        </button>

    </form>

    <div class="notice">
        Verify your account to continue.
        This is a controlled academic test page.
        No credentials are collected or transmitted.
    </div>

</div>

</body>
</html>
