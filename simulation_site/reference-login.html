<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Official Reference Login</title>
    <style>
        body {
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 380px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            color: #003087;
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #003087;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">PAYPAL TEST</div>

    <form action="#" method="post">

        <label>Email or Username</label>
        <input type="email" name="email">

        <label>Password</label>
        <input type="password" name="password">

        <button type="submit">
            Sign In
        </button>

    </form>

</div>

</body>
</html>
