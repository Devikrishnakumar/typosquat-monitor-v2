name: Tests

on:
  push:
    branches: [ main, master, development-upgrade ]
  pull_request:
    branches: [ main, master, development-upgrade ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest pytest-mock responses httpx

      - name: Check formatting with black
        run: black --check --diff src tests api
        continue-on-error: true

      - name: Lint with flake8
        run: flake8 src tests api --max-line-length=120 --extend-ignore=E203,W503
        continue-on-error: true

      - name: Run pytest
        run: pytest
